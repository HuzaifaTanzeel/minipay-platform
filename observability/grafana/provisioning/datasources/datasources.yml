apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Postgres
    uid: postgres
    type: postgres
    access: proxy
    url: db:5432
    user: $DB_USER
    editable: true
    jsonData:
      database: $DB_NAME
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: $DB_PASSWORD
