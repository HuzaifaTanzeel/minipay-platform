apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - configmap.yaml
  - postgres-service.yaml
  - postgres-statefulset.yaml
  - schema-init-job.yaml
  - api.yaml
  - web.yaml
  - ingress.yaml

configMapGenerator:
  - name: minipay-schema
    namespace: minipay
    files:
      - schema.sql
