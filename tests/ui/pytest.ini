[pytest]
# Run from the repository root:
#   python -m pytest -c tests/ui/pytest.ini tests/ui -v
#
# HTML report and traces are relative to the shell cwd (repo root).
pythonpath = .
addopts =
    --browser chromium
    --tracing retain-on-failure
    --screenshot only-on-failure
    --output test-results
    --html=evidence/ui/report.html
    --self-contained-html
